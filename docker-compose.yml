services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bebidas_scan}
      POSTGRES_USER: ${POSTGRES_USER:-bebidas_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bebidas_dev_password}
    volumes:
      - bebidas_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-bebidas_user}:${POSTGRES_PASSWORD:-bebidas_dev_password}@db:5432/${POSTGRES_DB:-bebidas_scan}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-troque_essa_chave_antes_de_publicar}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      OPEN_FOOD_FACTS_USER_AGENT: ${OPEN_FOOD_FACTS_USER_AGENT:-BebidasScan/0.1}
      AUTH_RATE_LIMIT_MAX_ATTEMPTS: ${AUTH_RATE_LIMIT_MAX_ATTEMPTS:-10}
      AUTH_RATE_LIMIT_WINDOW_SECONDS: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:-60}
      AUTH_RATE_LIMIT_IDENTITY_MAX_ATTEMPTS: ${AUTH_RATE_LIMIT_IDENTITY_MAX_ATTEMPTS:-5}
      AUTH_RATE_LIMIT_IDENTITY_WINDOW_SECONDS: ${AUTH_RATE_LIMIT_IDENTITY_WINDOW_SECONDS:-300}
      AUTH_LOCKOUT_SECONDS: ${AUTH_LOCKOUT_SECONDS:-900}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_CSRF_SECRET: ${ADMIN_CSRF_SECRET:-}
      WEB_CSRF_SECRET: ${WEB_CSRF_SECRET:-}
      WEB_COOKIE_SECURE: ${WEB_COOKIE_SECURE:-false}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
      MAX_REQUEST_BODY_BYTES: ${MAX_REQUEST_BODY_BYTES:-1048576}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${API_PORT:-8000}:8000"
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--proxy-headers",
        "--forwarded-allow-ips",
        "${FORWARDED_ALLOW_IPS:-127.0.0.1}",
      ]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  bebidas_postgres_data:
